# Bonito v0.1.0 — local dev stack: PostgreSQL (with pg_stat_statements) + store + collector.
#
#   docker compose -f examples/docker-compose.yml up -d          # all three
#   docker compose -f examples/docker-compose.yml up -d db store # without collector
#
# Then create the read-only role:
#   docker exec -i bonito-db psql -U postgres -d app < examples/readonly-role.sql

services:
  db:
    image: postgres:16
    container_name: bonito-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  store:
    build:
      context: ..
      dockerfile: examples/Dockerfile.store
    container_name: bonito-store
    environment:
      BONITO_DB: /data/bonito.db
      BONITO_STORE_PORT: "8000"
      BONITO_RETENTION_DAYS: "7"
    ports:
      - "8000:8000"
    volumes:
      - store-data:/data
    restart: unless-stopped

  collector:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: bonito-collector
    environment:
      BONITO_DSN: postgresql://bonito_ro:change-me@db:5432/app
      BONITO_STORE_URL: http://store:8000
      BONITO_PROM_PORT: "9187"
    ports:
      - "9187:9187"
    depends_on:
      - db
      - store
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: examples/Dockerfile.api
    container_name: bonito-api
    environment:
      BONITO_API_KEY: change-me
      BONITO_DB: /data/bonito.db
      BONITO_API_PORT: "8100"
    ports:
      - "8100:8100"
    volumes:
      - store-data:/data
    depends_on:
      - store
    restart: unless-stopped

volumes:
  store-data: