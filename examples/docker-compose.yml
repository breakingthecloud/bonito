# Bonito v0.1.0 — local dev stack: PostgreSQL (with pg_stat_statements) + collector.
#
#   docker compose -f examples/docker-compose.yml up -d
#
# Then create the read-only role:
#   docker exec -i bonito-db psql -U postgres -d app < examples/readonly-role.sql

services:
  db:
    image: postgres:16
    container_name: bonito-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  collector:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: bonito-collector
    environment:
      BONITO_DSN: postgresql://bonito_ro:change-me@db:5432/app
      BONITO_PROM_PORT: "9187"
    ports:
      - "9187:9187"
    depends_on:
      - db
    restart: unless-stopped