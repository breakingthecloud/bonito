[project]
name = "bonito-api"
version = "0.1.0"
description = "Bonito API — FastAPI query layer over bonito-store (BON-003). Private deployment, public OpenAPI contract."
authors = [{ name = "Carlos Cortez" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bonito-store>=0.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
bonito-api = "bonito_api.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S608"]