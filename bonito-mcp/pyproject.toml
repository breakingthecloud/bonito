[project]
name = "bonito-mcp"
version = "0.1.0"
description = "Bonito MCP server — deep DB observability tools for AI agents (BON-004)."
authors = [{ name = "Carlos Cortez" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
bonito-mcp = "bonito_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S608"]