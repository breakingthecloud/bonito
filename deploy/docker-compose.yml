# Bonito OSS — full stack (BON-005). `docker compose up` in < 5 min.
#
#   cp deploy/.env.example .env   # optional — sensible defaults below
#   docker compose -f deploy/docker-compose.yml up -d
#
# Starts: db (PostgreSQL fixture) + collector + store + api + mcp.

services:
  db:
    image: postgres:16
    container_name: bonito-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
    ports:
      - "5432:5432"
    volumes:
      - ./init-fixture.sql:/docker-entrypoint-initdb.d/init.sql:ro

  collector:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bonito-collector
    environment:
      BONITO_DSN: ${BONITO_DSN:-postgresql://bonito_ro:change-me@db:5432/app}
      BONITO_STORE_URL: http://store:8000
      BONITO_TOP_N: ${BONITO_TOP_N:-20}
      BONITO_PROM_PORT: ${BONITO_PROM_PORT:-9187}
    ports:
      - "${BONITO_PROM_PORT:-9187}:${BONITO_PROM_PORT:-9187}"
    depends_on:
      - db
      - store
    restart: unless-stopped

  store:
    build: ../bonito-store
    container_name: bonito-store
    environment:
      BONITO_DB: /data/bonito.db
      BONITO_STORE_PORT: "8000"
      BONITO_RETENTION_DAYS: ${BONITO_RETENTION_DAYS:-7}
    ports:
      - "8000:8000"
    volumes:
      - bonito-data:/data
    restart: unless-stopped

  api:
    build: ../bonito-api
    container_name: bonito-api
    environment:
      BONITO_API_KEY: ${BONITO_API_KEY:-change-me}
      BONITO_DB: /data/bonito.db
      BONITO_API_PORT: "8100"
    ports:
      - "8100:8100"
    volumes:
      - bonito-data:/data
    depends_on:
      - store
    restart: unless-stopped

  mcp:
    build: ../bonito-mcp
    container_name: bonito-mcp
    environment:
      BONITO_API_URL: http://api:8100
      BONITO_API_KEY: ${BONITO_API_KEY:-change-me}
    ports:
      - "8840:8840"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  bonito-data: