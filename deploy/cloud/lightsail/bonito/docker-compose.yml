# Bonito project — collector + store + api + mcp
# Images are built on the host from the bonito repo Dockerfiles:
#   docker build -t bonito/collector:0.1.1 .            (repo root)
#   docker build -t bonito/store:0.1.1 bonito-store/
#   docker build -t bonito/api:0.1.2 bonito-api/
#   docker build -t bonito/mcp:0.1.2 bonito-mcp/
#
#   docker compose --env-file ../.env -p bonito -f docker-compose.yml up -d

services:
  collector:
    image: bonito/collector:0.1.1
    container_name: bonito-collector
    restart: unless-stopped
    environment:
      BONITO_DSN: postgresql://bonito_ro:bonito@dbs-postgres:5432/app
      BONITO_STORE_URL: http://bonito-store:8000
      BONITO_TOP_N: ${BONITO_TOP_N:-10}
      BONITO_PROM_PORT: "9187"
    depends_on:
      - store
    networks: [bonito-net]

  store:
    image: bonito/store:0.1.1
    container_name: bonito-store
    restart: unless-stopped
    environment:
      BONITO_DB: /data/bonito.db
      BONITO_STORE_PORT: "8000"
      BONITO_RETENTION_DAYS: "7"
    volumes:
      - bonito-data:/data
    networks: [bonito-net]

  api:
    image: bonito/api:0.1.2
    container_name: bonito-api
    restart: unless-stopped
    environment:
      BONITO_API_KEY: ${BONITO_API_KEY:-change-me}
      BONITO_DB: /data/bonito.db
      BONITO_API_PORT: "8100"
    volumes:
      - bonito-data:/data
    depends_on:
      - store
    networks: [bonito-net]

  mcp:
    image: bonito/mcp:0.1.2
    container_name: bonito-mcp
    restart: unless-stopped
    environment:
      BONITO_API_URL: http://bonito-api:8100
      BONITO_API_KEY: ${BONITO_API_KEY:-change-me}
    depends_on:
      - api
    networks: [bonito-net]

networks:
  bonito-net:
    external: true

volumes:
  bonito-data: