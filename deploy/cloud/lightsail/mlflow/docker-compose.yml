# MLflow project — tracking server for Qhaway metrics (qhaway-004 exporter)
#
#   docker compose --env-file ../.env -p mlflow -f docker-compose.yml up -d

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    container_name: mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5002
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
    volumes:
      - mlflow-data:/mlflow
    networks: [bonito-net]

networks:
  bonito-net:
    external: true

volumes:
  mlflow-data: