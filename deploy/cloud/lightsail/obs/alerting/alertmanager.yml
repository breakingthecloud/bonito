# Alertmanager — route all Bonito alerts to Remo /ingest
#
# Demo tenant: URL + secret hardcodeadas (secret demo whsec_bonito_demo_001,
# consistente con remo-api/tenants/demo.yaml). send_resolved: false → solo
# alertas FIRING llegan a Remo (sin spam de "OK").

route:
  group_by: ['alertname', 'fingerprint']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: remo

receivers:
  - name: remo
    webhook_configs:
      - url: https://api.remo.sofe.dev/ingest
        send_resolved: false
        http_config:
          http_headers:
            X-Webhook-Secret:
              values:
                - whsec_bonito_demo_001